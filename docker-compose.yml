version: '3.8'

services:
  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-houseme_db}
      POSTGRES_USER: ${DB_USER:-houseme}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "houseme_project.wsgi:application"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-houseme_db}
      DB_USER: ${DB_USER:-houseme}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}

volumes:
  postgres_data:
